name: UX integration candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ux-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exact-ux-candidate:
    if: github.head_ref == 'integrate/ux-cleared-2026-10-19' || github.head_ref == 'claude/ux137-fix' || github.head_ref == 'integration/ux-night-2026-10-20' || github.head_ref == 'integration/ux-image-candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies and Chromium
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium webkit
      - name: Record exact candidate identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p evidence
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; sha256sum pnpm-lock.yaml; node --version; pnpm --version; } | tee evidence/identity.txt
      - name: Focused UX units
        run: |
          set -o pipefail
          pnpm --filter @retrodesk/web exec vitest run src/features/editor/store.test.ts src/features/editor/editorLocalWork.test.ts src/features/modules/minesweeper src/features/modules/instagram src/i18n/resources.test.ts 2>&1 | tee evidence/units.log
      - name: One combined build
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee evidence/build.log
      - name: Bounded cross-batch Chromium verification
        run: |
          set -o pipefail
          pnpm exec playwright test -c playwright.ux-integration.config.ts tests/e2e/ux-integration.spec.ts tests/e2e/editor-modal-accessibility.spec.ts tests/e2e/mobile-history-status.spec.ts tests/e2e/ig-shell-save-status.spec.ts tests/e2e/ig-editor-flow.spec.ts tests/e2e/mobile-content-settings.spec.ts tests/e2e/audit-f09-f10.spec.ts tests/e2e/help-tour.spec.ts tests/e2e/ux-review-fixes.spec.ts tests/e2e/audit-f12-compact-editors.spec.ts tests/e2e/editor-save-session.spec.ts tests/e2e/error-localization.spec.ts tests/e2e/appearance-migration-upgrade.spec.ts tests/e2e/window-chrome.visual.spec.ts 2>&1 | tee evidence/browser.log
      - name: WebKit pass of the interaction specs
        run: |
          set -o pipefail
          pnpm exec playwright test -c playwright.ux-webkit.config.ts tests/e2e/help-tour.spec.ts tests/e2e/editor-modal-accessibility.spec.ts tests/e2e/mobile-content-settings.spec.ts tests/e2e/mobile-history-status.spec.ts tests/e2e/ig-editor-flow.spec.ts tests/e2e/audit-f12-compact-editors.spec.ts tests/e2e/ux-review-fixes.spec.ts 2>&1 | tee evidence/webkit.log
      - name: Image suites on the merged candidate (Chromium)
        if: github.head_ref == 'integration/ux-image-candidate'
        run: |
          set -o pipefail
          pnpm --filter @retrodesk/api test:unit 2>&1 | tee evidence/api-units.log
          for c in image-authoring image-readiness image-w3a image-w3b image-reader-production; do pnpm exec playwright test -c playwright.$c.config.ts 2>&1 | tee evidence/image-$c.log; done
      - name: Image authoring on WebKit
        if: github.head_ref == 'integration/ux-image-candidate'
        run: |
          set -o pipefail
          pnpm exec playwright test -c playwright.image-webkit.config.ts 2>&1 | tee evidence/image-webkit.log
      - name: Confirm unchanged candidate
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-candidate-${{ github.event.pull_request.head.sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 7
