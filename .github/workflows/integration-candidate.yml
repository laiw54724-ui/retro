name: Integration candidate verification

on:
  push:
    branches:
      - integration/retro-usability-release
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: integration-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-final-sha:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.18.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Lint the final commit
        run: pnpm lint

      - name: Complete contributor gate on the same commit
        run: pnpm verify:contributor

      - name: Window chrome Chromium baselines
        run: pnpm exec playwright test --config=playwright.chrome.config.ts --project=chrome-linux --workers=1

      - name: Window chrome WebKit smoke
        run: pnpm exec playwright test --config=playwright.chrome.config.ts --project=chrome-webkit --workers=1

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-candidate-playwright-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
