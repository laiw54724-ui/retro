name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Optional. Fail unless the checked-out commit is exactly this full SHA."
        required: false
        default: ""
      image_qa_site_ids:
        description: "Optional. Comma-separated site IDs allowed to show the Image entry, or * for every staging site. Empty keeps Image off for everyone."
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "supabase/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/deploy-staging.yml"

concurrency:
  group: retrodesk-staging
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.18.2 --activate

      - name: Verify exact commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee deploy-sha.txt
          if [ -n "${EXPECTED_SHA:-}" ]; then test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"; fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm typecheck
          pnpm build

      - name: Record rollback targets (before deploying)
        run: |
          set +e
          echo "== API worker deployments" ; (cd apps/api && pnpm exec wrangler deployments list --env staging 2>&1 | tail -n 25)
          echo "== Pages deployments" ; (cd apps/web && pnpm exec wrangler pages deployment list --project-name=retrodesk-staging 2>&1 | head -n 15)
          true

      - name: Deploy API Worker
        working-directory: apps/api
        env:
          QA_SITE_IDS: ${{ inputs.image_qa_site_ids }}
        run: |
          pnpm exec wrangler deploy --env staging \
            --var "ALLOWED_ORIGINS:${{ vars.WEB_ORIGIN }}" \
            --var "PUBLIC_ASSET_BASE_URL:${{ vars.ASSET_BASE_URL }}" \
            --var "IMAGE_QA_SITE_IDS:$QA_SITE_IDS"

      - name: Build web
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          QA_SITE_IDS: ${{ inputs.image_qa_site_ids }}
        run: |
          if [ -n "$QA_SITE_IDS" ]; then
            RETRO_IMAGE_RELEASE_CONFIG="$PWD/config/image-staging-rollout.qa.json" NODE_ENV=production pnpm build:staging
          else
            pnpm build
          fi

      - name: Deploy Pages
        working-directory: apps/web
        run: pnpm deploy:staging

      - name: Record deployed identity
        run: |
          echo "source sha: $(cat deploy-sha.txt)"
          echo "image receipt:"; cat apps/web/dist/image-rollout.json
          (cd apps/api && pnpm exec wrangler deployments list --env staging 2>&1 | tail -n 6) || true

      - name: API smoke test
        if: ${{ vars.API_URL != '' }}
        run: curl --fail --silent --show-error "${{ vars.API_URL }}/api/health"
