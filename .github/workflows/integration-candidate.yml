name: Integration candidate verification

on:
  push:
    branches:
      - integration/retro-usability-release
      - integration/retro-q0-validation
      - claude/retro-release-candidate
      - claude/retro-i18n-foundation
      - claude/retro-oc-ig-editor
      - claude/retro-i18n-expansion
      - integration/retro-preview-r1-r2
      - integration/retro-preview-r1-r3
      - integration/retro-preview-media
      - integration/retro-night-quality-01
      - integration/retro-followup-bc-01
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-final-sha:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.18.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Record exact source identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p .candidate-evidence
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; sha256sum pnpm-lock.yaml; node --version; pnpm --version; pnpm exec playwright --version; } | tee .candidate-evidence/identity.txt

      - name: Lint the final commit
        run: |
          set -euo pipefail
          pnpm lint 2>&1 | tee .candidate-evidence/lint.log

      - name: Complete contributor gate on the same commit
        run: |
          set -euo pipefail
          trap 'if [ -d test-results ]; then cp -a test-results .candidate-evidence/contributor-test-results; fi' EXIT
          pnpm verify:contributor 2>&1 | tee .candidate-evidence/contributor.log

      - name: ja/ko preview-mode i18n flows
        run: |
          set -euo pipefail
          pnpm test:e2e:i18n-preview 2>&1 | tee .candidate-evidence/i18n-preview.log

      - name: Window chrome Chromium baselines
        run: |
          set -euo pipefail
          pnpm exec playwright test --config=playwright.chrome.config.ts --project=chrome-linux --workers=1 2>&1 | tee .candidate-evidence/chrome-linux.log

      - name: Window chrome WebKit smoke
        run: |
          set -euo pipefail
          pnpm exec playwright test --config=playwright.chrome.config.ts --project=chrome-webkit --workers=1 2>&1 | tee .candidate-evidence/chrome-webkit.log

      - name: Confirm unchanged source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-candidate-playwright-${{ github.sha }}
          path: |
            .candidate-evidence
            playwright-report
            test-results
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
