name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy to confirm production release"
        required: true
        default: ""

concurrency:
  group: retrodesk-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.18.2 --activate

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Verify
        run: |
          pnpm typecheck
          pnpm build

      - name: Deploy API Worker
        working-directory: apps/api
        run: |
          pnpm exec wrangler deploy --env production \
            --var "ALLOWED_ORIGINS:${{ vars.WEB_ORIGIN }}" \
            --var "PUBLIC_ASSET_BASE_URL:${{ vars.ASSET_BASE_URL }}"

      - name: Build web
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: pnpm build

      - name: Deploy Pages
        working-directory: apps/web
        run: pnpm deploy:production

      - name: API smoke test
        if: ${{ vars.API_URL != '' }}
        run: curl --fail --silent --show-error "${{ vars.API_URL }}/api/health"
