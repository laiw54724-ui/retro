name: Assemble integration candidate

on:
  push:
    branches:
      - integration/retro-usability-release

permissions:
  contents: write

concurrency:
  group: assemble-retro-usability-release
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: integration/retro-usability-release

      - name: Reproduce reviewed integration tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --no-tags origin \
            refs/heads/feat/retro-window-chrome:refs/remotes/origin/feat/retro-window-chrome \
            refs/heads/codex/component-operation-fixes:refs/remotes/origin/codex/component-operation-fixes \
            refs/heads/feat/retro-media-editor:refs/remotes/origin/feat/retro-media-editor

          git merge --no-ff --no-edit origin/feat/retro-window-chrome
          git merge --no-ff --no-edit origin/codex/component-operation-fixes

          set +e
          git merge --no-ff --no-commit origin/feat/retro-media-editor
          merge_status=$?
          set -e
          test "$merge_status" -ne 0

          actual_unmerged="$(git diff --name-only --diff-filter=U | sort)"
          expected_unmerged="$(printf '%s\n' \
            'apps/web/src/features/modules/gallery/index.tsx' \
            'tests/e2e/editor-media.spec.ts' \
            'tests/e2e/public-sharing.spec.ts')"
          test "$actual_unmerged" = "$expected_unmerged"

          tar -xzf .integration/conflict-resolutions.tgz
          git add \
            apps/web/src/features/modules/gallery/index.tsx \
            tests/e2e/editor-media.spec.ts \
            tests/e2e/public-sharing.spec.ts
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "merge: integrate shared media editor and preserve gallery accessibility (#43, #47)"

          cat .integration/final.patch.gz.part-* > "$RUNNER_TEMP/final.patch.gz"
          echo "34a69940da66b519900c3079c36429fe19f48faede9fd101d485f899e4ebd5db  $RUNNER_TEMP/final.patch.gz" | sha256sum --check -
          gzip -dc "$RUNNER_TEMP/final.patch.gz" > "$RUNNER_TEMP/final.patch"
          git apply --index --3way "$RUNNER_TEMP/final.patch"

          # GitHub Actions may not create or delete workflow files with its token.
          # Keep the bootstrap payload unchanged here; the integration owner removes it
          # and installs the final verification workflow in the next, exact-tree commit.
          git restore --source=HEAD --staged --worktree .github/workflows .integration
          git add -A
          git commit -m "fix(integration): assemble usability release candidate sources"

          git diff --exit-code HEAD^ -- .github/workflows .integration
          git diff --check HEAD^
          git push origin HEAD:integration/retro-usability-release
