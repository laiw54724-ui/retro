name: Feature proposal
description: Propose an OC platform or editor improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check existing issues and PRs first. Use synthetic examples; do not include private content, account details or local paths.
  - type: textarea
    id: problem
    attributes:
      label: Creator problem
      description: What should creators or visitors be able to accomplish?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe a small independently reviewable change and how you would know it works.
    validations:
      required: true
  - type: textarea
    id: accessibility
    attributes:
      label: Keyboard, touch, and mobile considerations
  - type: textarea
    id: assets
    attributes:
      label: Third-party assets or references
      description: Include source, version, author, and license; do not attach unlicensed media.
