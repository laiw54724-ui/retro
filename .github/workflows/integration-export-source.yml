name: Integration source export

on:
  push:
    branches:
      - integration/retro-usability-release

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pack repository with git history
        run: tar -czf "$RUNNER_TEMP/retro-repo.tgz" .
      - uses: actions/upload-artifact@v4
        with:
          name: retro-integration-repo
          path: ${{ runner.temp }}/retro-repo.tgz
          if-no-files-found: error
          retention-days: 1
