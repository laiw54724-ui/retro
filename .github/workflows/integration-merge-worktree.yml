name: Integration merge worktree

on:
  push:
    branches:
      - integration/merge-usability-probe

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/retro-usability-release
          fetch-depth: 0
      - name: Materialize conflicted merge worktree
        shell: bash
        run: |
          set -u
          git config user.name "Retro integration probe"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin claude/usability-batch1
          set +e
          git merge --no-commit --no-ff origin/claude/usability-batch1
          status=$?
          set -e
          printf '%s\n' "$status" > .integration-merge-status
          git diff --name-only --diff-filter=U > .integration-conflicts
          tar --exclude=.git --exclude=node_modules -czf "$RUNNER_TEMP/merge-worktree.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: integration-merge-worktree
          path: ${{ runner.temp }}/merge-worktree.tar.gz
          if-no-files-found: error
          retention-days: 3
