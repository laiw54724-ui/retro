name: Q0 final import guard and release verification
on:
  push:
    branches: [chore/retro-direct-workbench]
    paths: [.github/workflows/q0-confirmation-validation.yml]
permissions:
  contents: read
concurrency:
  group: retro-q0-confirmation-validation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply only the reviewed four-file correction
        id: commit
        env:
          EXPECTED_PARENT: b984a293048f16e8160e5786d1943f45d1d085f5
          EXPECTED_TREE: e67c92c3571fb81dd4e07ac9e609fd59159b8cea
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp .integration/q0-icon-transfer.patch "$RUNNER_TEMP/q0-icon-transfer.patch"
          printf '0cb465a707d1b3f2e70d061ea35f8855b9265233ef2709596b87542863624f14  %s\n' "$RUNNER_TEMP/q0-icon-transfer.patch" | sha256sum --check
          git worktree add --detach "$RUNNER_TEMP/q0-confirmed" "$EXPECTED_PARENT"
          cd "$RUNNER_TEMP/q0-confirmed"
          git apply --index --check "$RUNNER_TEMP/q0-icon-transfer.patch"
          git apply --index "$RUNNER_TEMP/q0-icon-transfer.patch"
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git -c user.name='Retro integration' -c user.email='integration@users.noreply.github.com' commit -m 'fix(transfer): include uploaded icons in verified import warnings'
          sha="$(git rev-parse HEAD)"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT"
          test "$(git ls-remote https://github.com/laiw54724-ui/retro.git refs/heads/integration/retro-q0-validation | cut -f1)" = "$EXPECTED_PARENT"
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$header" push https://github.com/laiw54724-ui/retro.git HEAD:refs/heads/integration/retro-q0-validation
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'Verified candidate SHA: %s\nVerified tree: %s\n' "$sha" "$EXPECTED_TREE"
  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Install frozen tooling and pinned browsers
        run: |
          corepack enable
          corepack prepare pnpm@10.18.2 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium webkit
      - name: Record exact source identity
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p .candidate-evidence
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; sha256sum pnpm-lock.yaml; node --version; pnpm --version; pnpm exec playwright --version; } | tee .candidate-evidence/identity.txt
      - name: Confirm old and omitted-manifest icon imports before release checks
        run: |
          set -euo pipefail
          { pnpm --filter @retrodesk/shared test:unit test/site-transfer.test.ts test/media-semantics.test.ts && pnpm --filter @retrodesk/api test:unit test/transfer-routes.test.ts; } 2>&1 | tee .candidate-evidence/focused.log
      - name: Lint the final commit
        run: |
          set -euo pipefail
          pnpm lint 2>&1 | tee .candidate-evidence/lint.log
      - name: Complete unchanged contributor gate
        run: |
          set -euo pipefail
          trap 'if [ -d test-results ]; then cp -a test-results .candidate-evidence/contributor-test-results; fi' EXIT
          pnpm verify:contributor 2>&1 | tee .candidate-evidence/contributor.log
      - name: Linux WindowChrome unchanged baselines
        run: |
          set -euo pipefail
          pnpm exec playwright test --config=playwright.chrome.config.ts --project=chrome-linux --workers=1 2>&1 | tee .candidate-evidence/chrome-linux.log
      - name: WindowChrome WebKit smoke
        run: |
          set -euo pipefail
          pnpm exec playwright test --config=playwright.chrome.config.ts --project=chrome-webkit --workers=1 2>&1 | tee .candidate-evidence/chrome-webkit.log
      - name: Confirm source did not change
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q0-confirmed-final-${{ needs.prepare.outputs.sha }}
          path: |
            .candidate-evidence
            test-results
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
