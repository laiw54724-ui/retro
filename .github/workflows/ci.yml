name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.18.2 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Secret and asset policy audits
        run: |
          pnpm security:audit
          pnpm assets:audit
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit security tests
        run: pnpm test:unit
      - name: Build
        run: pnpm build
      - name: Scan build artifacts
        run: pnpm security:audit -- --artifacts-only
