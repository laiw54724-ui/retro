name: Direct integration workbench
on:
  push:
    branches: [chore/retro-direct-workbench]
    paths: [.github/workflows/direct-workbench.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bdc50f55d2507dd9a734c0413e8e3fba45e8d013
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Prepare pinned offline dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.18.2 --activate
          pnpm install --frozen-lockfile
          mkdir -p "$RUNNER_TEMP/retro-workbench"
          git bundle create "$RUNNER_TEMP/retro-workbench/source.bundle" --all
          tar -czf "$RUNNER_TEMP/retro-workbench/dependencies.tar.gz" node_modules apps/web/node_modules apps/api/node_modules packages/shared/node_modules
          cp "$(command -v node)" "$RUNNER_TEMP/retro-workbench/node"
          npm pack pnpm@10.18.2 --pack-destination "$RUNNER_TEMP/retro-workbench"
          {
            printf 'source_head='; git rev-parse HEAD
            printf 'source_tree='; git rev-parse HEAD^{tree}
            printf 'lockfile_sha256='; sha256sum pnpm-lock.yaml
            git for-each-ref --format='%(refname) %(objectname)'
            node --version
            pnpm --version
          } > "$RUNNER_TEMP/retro-workbench/provenance.txt"
          cd "$RUNNER_TEMP/retro-workbench"
          sha256sum source.bundle dependencies.tar.gz node pnpm-10.18.2.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: retro-direct-offline-workbench
          path: ${{ runner.temp }}/retro-workbench
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
