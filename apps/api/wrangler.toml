name = "retrodesk-api-dev"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "http://localhost:5173"
PUBLIC_ASSET_BASE_URL = "http://localhost:8787/api/assets"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "retrodesk-assets-dev"

[env.staging]
name = "retrodesk-api-staging"

[[env.staging.r2_buckets]]
binding = "ASSETS"
bucket_name = "retrodesk-assets-staging"

[env.production]
name = "retrodesk-api"

[[env.production.r2_buckets]]
binding = "ASSETS"
bucket_name = "retrodesk-assets"
