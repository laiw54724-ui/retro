name: Bug report
description: Report a reproducible Retro problem without private data.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste tokens, private site content, invitation links, or personal information. Use SECURITY.md for vulnerabilities.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include what you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps using demo or redacted content.
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release URL or commit
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [Desktop editor, Mobile editor, Visitor site, API, Deployment]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser and viewport
