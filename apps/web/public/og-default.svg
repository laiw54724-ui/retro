<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Retro Desktop</title>
  <desc id="desc">A teal Windows 98 inspired desktop preview.</desc>
  <rect width="1200" height="630" fill="#008080"/>
  <path d="M0 0h1200v630H0z" fill="url(#dots)" opacity=".38"/>
  <defs><pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="3" fill="#71c4c4"/></pattern></defs>
  <g transform="translate(150 115)">
    <rect width="900" height="400" fill="#c0c0c0" stroke="#fff" stroke-width="8"/>
    <rect x="8" y="8" width="884" height="58" fill="#000080"/>
    <text x="35" y="49" fill="#fff" font-family="monospace" font-size="34">Retro Desktop</text>
    <rect x="50" y="110" width="800" height="190" fill="#fff" stroke="#808080" stroke-width="6"/>
    <text x="450" y="205" text-anchor="middle" fill="#000" font-family="monospace" font-size="64">YOUR OC WORLD</text>
    <text x="450" y="265" text-anchor="middle" fill="#333" font-family="monospace" font-size="30">inside a tiny retro computer</text>
    <rect x="50" y="330" width="220" height="48" fill="#c0c0c0" stroke="#000" stroke-width="4"/>
    <text x="160" y="364" text-anchor="middle" fill="#000" font-family="monospace" font-size="28">START</text>
  </g>
</svg>
